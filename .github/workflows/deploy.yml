name: deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  PROJECT_ID: ai-researcher-capstone
  REGION: us-central1
  ARTIFACT_REPO: ai-researcher
  CLOUD_RUN_SERVICE: ai-researcher-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      # Chromium só — playwright.config.ts (apps/web) só declara o projeto chromium.
      # DEMO=true (playwright.config.ts, webServer) tira Postgres e Vertex AI da equação:
      # nenhum secret novo precisa entrar no workflow pra rodar o F.7.
      - run: pnpm --filter @hero/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/473939301392/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-deployer@ai-researcher-capstone.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build e push da imagem da API
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build \
            -f infra/docker/api.Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }} \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}

      # Canary (G.6): sobe a revisão nova sem tráfego nenhum (no_traffic) e com uma tag fixa
      # ("canary"), que o Cloud Run expõe numa URL própria — https://canary---<serviço>. A
      # revisão anterior continua servindo 100% do tráfego real até o healthcheck abaixo
      # passar. Se a revisão nova estiver quebrada, ela nunca chega a servir usuário nenhum —
      # não precisa de rollback pra esse caso, só pro caso de algo passar no healthcheck e
      # falhar depois (aí entra scripts/rollback.ts, pnpm rollback).
      - name: Deploy no Cloud Run (canary, sem tráfego)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}
          secrets: |-
            DATABASE_URL=database-url:latest
            LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest
            LANGFUSE_SECRET_KEY=langfuse-secret-key:latest
            SERPER_API_KEY=serper-api-key:latest
            OTEL_EXPORTER_OTLP_HEADERS=otel-exporter-otlp-headers:latest
          env_vars: |-
            LANGFUSE_BASE_URL=https://us.cloud.langfuse.com
            OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp-gateway-prod-sa-east-1.grafana.net/otlp
          flags: --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:ai-researcher-db
          no_traffic: true
          tag: canary

      - name: Healthcheck da revisão canary
        run: |
          CANARY_URL="https://canary---$(echo '${{ steps.deploy.outputs.url }}' | sed 's#https://##')"
          echo "Checando $CANARY_URL/api/health..."
          curl --fail --retry 8 --retry-delay 5 --retry-connrefused "$CANARY_URL/api/health"

      - name: Promove a revisão canary pra 100% do tráfego
        run: |
          gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --to-latest

      - name: Build do Angular
        run: pnpm turbo run build --filter=@hero/web

      - name: Deploy no Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
